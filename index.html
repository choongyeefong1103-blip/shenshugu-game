<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102b32"><title>神樹鼓｜第一章 Demo</title></head>
<style>
:root{--bg:#102b32;--teal:#3f7f6b;--mint:#6aa99a;--gold:#d9a441;--rust:#8c3b2a;--cream:#f2e6c9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a20;color:var(--cream);font-family:system-ui,sans-serif;touch-action:manipulation}#app{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#102b32,#071a20)}header{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#0d252c;font-size:12px}header b{color:var(--gold);letter-spacing:2px}#stage{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071a20d9;padding:16px;z-index:3}.panel{width:min(520px,100%);border:1px solid var(--mint);border-radius:18px;background:linear-gradient(145deg,#183e42,#0c242b);padding:22px;text-align:center;box-shadow:0 12px 50px #0008}h1{font-size:clamp(30px,8vw,48px);margin:0;color:var(--gold);letter-spacing:5px}h2{font-size:19px;margin:6px 0 12px}p{color:#c7d4c6;line-height:1.6;font-size:14px}button{border:2px solid var(--mint);border-radius:14px;background:#214d4e;color:var(--cream);font-weight:800;font-size:18px;padding:12px;min-height:54px;touch-action:manipulation}.primary{background:#946722;border-color:#e5bd60}.small{font-size:13px;min-height:36px;padding:6px 12px}#controls{flex:none;padding:7px 12px max(9px,env(safe-area-inset-bottom));background:#0b2027;border-top:1px solid #31534f}#prompt{text-align:center;height:25px;color:var(--gold);font-weight:800;font-size:15px}#beatrow{height:28px;display:flex;justify-content:center;gap:9px;align-items:center}.beat{width:22px;height:22px;border:1px solid #638b7c;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#9db7a8}.beat.active{background:var(--gold);color:#172b2a;box-shadow:0 0 18px #e9b94f}#buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.pad{height:clamp(65px,12vh,96px);font-size:clamp(22px,5vw,32px);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px}.pad span{font-size:12px;display:block;opacity:.8}#bell{background:#1d5551}#drum{background:#694323;border-color:var(--gold)}#extra{display:flex;justify-content:center;gap:8px;margin-top:7px}#feedback{height:21px;text-align:center;font-size:13px;padding-top:3px;color:#a8c6b5}@media(orientation:portrait){.pad{height:65px}}
</style><body><div id="app"><header><b>神樹鼓 · SHEN SHU GU</b><span id="chapter">第一章｜枯樹之下　 <span id="time">00:00</span>　<span id="combo">連擊 0</span></span></header><div id="stage"><canvas id="game"></canvas><div id="overlay"><div class="panel" id="panel"><h1>神樹鼓</h1><h2>第一章 · 枯樹之下</h2><p>神樹的第一道傷口正在枯萎。跟隨祭器節奏敲擊，指揮隊伍前進、攻擊，最後迎戰枯根山靈。</p><p><b>鈴＝前進　｜　鼓＝攻擊</b><br>依照節奏提示逐拍按下正確祭器。連續準確完成指令，累積通天之力。</p><p style="font-size:12px">建議手機橫屏遊玩。開始後請開啟聲音。</p><button class="primary" id="start">開始出征</button><div style="margin-top:8px"><button class="small" id="how">玩法說明</button></div></div></div></div><div id="controls"><div id="prompt">等待祭器節奏…</div><div id="beatrow"><div class="beat">1</div><div class="beat">2</div><div class="beat">3</div><div class="beat">4</div></div><div id="buttons"><button class="pad" id="bell">🔔 鈴<span>前進</span></button><button class="pad" id="drum">🥁 鼓<span>攻擊</span></button></div><div id="extra"><button class="small" id="pause">暫停</button><button class="small" id="sound">聲音：開</button><button class="small" id="restart">重新開始</button></div><div id="feedback">準備跟拍</div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),c=$('game'),x=c.getContext('2d');let W=900,H=500,dpr=1,started=false,paused=false,finished=false,audio=null,audioOn=true,last=0,t0=0,elapsed=0,idx=0,beat=0,targets=[],combo=0,perfect=0,good=0,miss=0,flag=100,enemyHP=100,bossHP=100,enemy=false,fever=false,player=0,bossPhase='';const pats={move:['鈴','鈴','鈴','鼓'],attack:['鼓','鼓','鈴','鼓']},M=[];function add(n,sec,bpm,cmd,pat,event=''){M.push({n,sec,bpm,cmd,pat,event})}add(1,'教學A',100,'—',null,'青銅輪與鈴聲示範');add(2,'教學A',100,'—',null,'青銅輪與鈴聲示範');for(let n=3;n<=6;n++)add(n,'教學A',100,'前進','move','Perfect 時青銅輪發亮');add(7,'教學B',100,'前進','move');add(8,'教學B',100,'前進','move','根妖出現');for(let n=9;n<=11;n++)add(n,'教學B',100,'攻擊','attack','根妖進入射程');add(12,'實戰',100,'前進','move','兩隻根妖');for(let n=13;n<=27;n++)add(n,'實戰',100,n%2?'前進':'攻擊',n%2?'move':'attack',n===16?'枯枝弩手出現':n===20?'第一波根妖':n===24?'第二波根妖與弩手':'');for(let n=28;n<=35;n++)add(n,'通天教學',100,n%2?'前進':'攻擊',n%2?'move':'attack',n===28?'連續四次不 Miss 觸發通天':n===35?'神樹亮起、隊伍轉金':'');for(let n=36;n<=75;n++){let k=(n-36)%3,cy=Math.floor((n-36)/3)+1;add(n,'Boss',110,k===0?'前進':'攻擊',k===0?'move':'attack',k===0?`循環${cy}：蜷縮預警`:k===1?'Boss 出手，攻擊旗手':'弱點亮起：兩倍傷害')}add(76,'結算',110,'—',null,'結算');const times=M.map((m,i)=>i<35?i*4.8:168+(i-35)*(480/110));function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(c);resize();function tone(f=440,d=.1,type='sine',v=.05){if(!audioOn)return;try{audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function msg(s,col='#a8c6b5'){$('feedback').textContent=s;$('feedback').style.color=col}function setM(i){idx=i;beat=0;let m=M[i];targets=m.pat?pats[m.pat]:[];$('prompt').textContent=targets.length?`${m.cmd}指令： ${targets.join('　')}`:m.event; if(m.n===8||m.n===12||m.n===16||m.n===20||m.n===24)enemy=true;if(m.sec==='Boss'){enemy=true;if(m.n===36)bossHP=100;}if(m.n===35){fever=true;msg('通天成功！神樹甦醒！','#f5c85c');tone(880,.5,'sine',.1)}if(m.n===36){msg('枯根山靈出現！','#e6a35a');tone(90,.6,'sawtooth',.1)}if(m.sec==='Boss')bossPhase=['預警','出手','弱點'][(m.n-36)%3];else bossPhase=''}function tap(k){if(!started||paused||finished)return;if(!targets.length||beat>=4){msg('聆聽下一組節奏');return}let target=times[idx]+.42+beat*60/M[idx].bpm,delta=elapsed-target;if(Math.abs(delta)>.25){miss++;combo=0;msg('MISS · 跟上下一拍','#e28a72');tone(100,.12,'square');beat++;return}if(k!==targets[beat]){miss++;combo=0;msg('祭器錯誤 · MISS','#e28a72');tone(100,.12,'square');beat++;return}if(Math.abs(delta)<.105){perfect++;combo++;msg('PERFECT！','#f0c35b');tone(k==='鈴'?680:190,.12,k==='鈴'?'sine':'triangle',.08)}else{good++;combo++;msg('GOOD','#a7d5b4');tone(k==='鈴'?550:220)}if(combo>=16)fever=true;if(k==='鈴')player=Math.min(1,player+.04);else if(M[idx].sec==='Boss'){bossHP=Math.max(0,bossHP-(bossPhase==='弱點'?12:3));if(bossHP===0){msg('枯根山靈被擊退！','#f5c85c');fever=true}}else if(enemy){enemyHP-=22;if(enemyHP<=0){enemy=false;enemyHP=100}}beat++} $('bell').onpointerdown=e=>{e.preventDefault();tap('鈴')};$('drum').onpointerdown=e=>{e.preventDefault();tap('鼓')};function begin(){audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume();started=true;paused=false;finished=false;elapsed=0;t0=performance.now();last=t0;idx=0;beat=0;combo=perfect=good=miss=0;flag=100;enemy=false;enemyHP=100;fever=false;player=0;$('overlay').style.display='none';setM(0);requestAnimationFrame(loop)}$('start').onclick=begin;$('how').onclick=()=>{$('panel').innerHTML='<h2>玩法說明</h2><p>看提示、聽節拍，在每一拍按下正確祭器。鈴完成前進指令，鼓完成攻擊指令。按錯或錯過節拍會 Miss。連續成功可進入通天狀態。Boss 蜷縮是預警，出手後弱點窗口可造成雙倍傷害。</p><button class="primary" id="back">明白，開始</button>';$('back').onclick=begin};$('pause').onclick=()=>{if(!started||finished)return;paused=!paused;if(paused){$('pause').textContent='繼續';msg('已暫停')}else{$('pause').textContent='暫停';t0=performance.now()-elapsed*1000;last=performance.now();requestAnimationFrame(loop)}};$('sound').onclick=()=>{audioOn=!audioOn;$('sound').textContent='聲音：'+(audioOn?'開':'關')};$('restart').onclick=()=>{if(confirm('重新開始第一章？'))location.reload()};function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#163e46');g.addColorStop(.7,'#24534e');g.addColorStop(1,'#101f27');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#d9a441';x.globalAlpha=.7;x.beginPath();x.arc(W*.76,H*.25,Math.min(W,H)*.12,0,7);x.fill();x.globalAlpha=1;for(let i=0;i<8;i++){let xx=(i*W/7-(elapsed*7)%W+W)%W;x.fillStyle=i%2?'#1b4847':'#285e54';x.fillRect(xx,H*.37,W*.025,H*.3);x.fillRect(xx-W*.01,H*.36,W*.05,8);eye(xx+W*.012,H*.44,Math.max(4,W*.008))}x.strokeStyle=fever?'#e7bc55':'#0a2428';x.lineWidth=Math.max(5,W*.012);x.lineCap='round';x.beginPath();x.moveTo(W*.83,H*.7);x.lineTo(W*.83,H*.23);x.lineTo(W*.72,H*.16);x.moveTo(W*.83,H*.36);x.lineTo(W*.94,H*.17);x.moveTo(W*.83,H*.43);x.lineTo(W*.68,H*.28);x.stroke();x.fillStyle='#081a1e';x.beginPath();x.moveTo(0,H*.78);for(let a=0;a<=W;a+=20)x.lineTo(a,H*.78+Math.sin(a*.018+elapsed)*H*.012);x.lineTo(W,H);x.lineTo(0,H);x.fill();let bx=W*(.17+player*.2);for(let i=0;i<5;i++)warrior(bx+i*W*.045,H*.76-(i%2)*8,i===0);if(M[idx].sec==='Boss')boss(W*.78,H*.68);else if(enemy){for(let i=0;i<2;i++)rootling(W*(.72+i*.055),H*.73)}x.fillStyle='#f2e6c9';x.font=`bold ${Math.max(12,W*.018)}px sans-serif`;x.fillText(`${M[idx].sec} · 第 ${M[idx].n} 小節`,14,24);if(M[idx].sec==='Boss'){x.fillStyle='#172326';x.fillRect(W*.57,14,W*.32,9);x.fillStyle='#d9a441';x.fillRect(W*.57,14,W*.32*(bossHP/100),9);x.fillStyle='#f2e6c9';x.fillText('枯根山靈',W*.57,11)}x.fillStyle='#6aa99a';x.fillRect(14,34,W*.22,7);x.fillStyle='#d9a441';x.fillRect(14,34,W*.22*flag/100,7);x.fillStyle='#f2e6c9';x.fillText('旗手',14,54);if(fever){x.strokeStyle='#f3c65c';x.lineWidth=4;x.beginPath();x.arc(W*.5,H*.44,Math.min(W,H)*.24,0,7);x.stroke();x.font=`bold ${Math.max(18,W*.04)}px sans-serif`;x.fillStyle='#f3c65c';x.fillText('通 天',W*.46,H*.17)}if(targets.length){let xx=W*.4,gap=Math.min(W*.065,42);for(let i=0;i<4;i++){x.beginPath();x.arc(xx+i*gap,H*.12,Math.max(10,W*.014),0,7);x.fillStyle=i<beat?'#d9a441':'#214c4b';x.fill();x.strokeStyle='#9cc4aa';x.stroke();x.fillStyle='#f5ead1';x.textAlign='center';x.fillText(targets[i],xx+i*gap,H*.12+4)}x.textAlign='left'}}function eye(a,b,r){x.fillStyle='#d9a441';x.beginPath();x.ellipse(a,b,r*1.5,r,0,0,7);x.fill();x.fillStyle='#102b32';x.beginPath();x.arc(a,b,r*.45,0,7);x.fill()}function warrior(a,b,flagman){x.save();x.translate(a,b);x.fillStyle=fever?'#d9a441':'#3f7f6b';x.strokeStyle='#071a20';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(-20,-72);x.lineTo(20,-72);x.lineTo(24,-34);x.lineTo(14,-22);x.lineTo(-14,-22);x.lineTo(-24,-34);x.closePath();x.fill();x.stroke();x.fillStyle='#d9a441';x.fillRect(-12,-57,24,4);x.strokeStyle='#3f7f6b';x.lineWidth=7;x.beginPath();x.moveTo(-13,-72);x.lineTo(-23,-88);x.moveTo(13,-72);x.lineTo(23,-88);x.stroke();x.strokeStyle='#071a20';x.lineWidth=6;x.beginPath();x.moveTo(0,-22);x.lineTo(0,-3);x.moveTo(0,-15);x.lineTo(-16,0);x.moveTo(0,-15);x.lineTo(16,0);x.moveTo(0,-3);x.lineTo(-11,18);x.moveTo(0,-3);x.lineTo(11,18);x.stroke();if(flagman){x.strokeStyle='#d9a441';x.lineWidth=4;x.beginPath();x.moveTo(22,-5);x.lineTo(22,-110);x.stroke();x.fillStyle='#d9a441';x.beginPath();x.moveTo(22,-110);x.lineTo(46,-100);x.lineTo(22,-90);x.fill()}x.restore()}function rootling(a,b){x.save();x.translate(a,b);x.strokeStyle='#8c3b2a';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(0,-25);x.lineTo(-10,-45);x.lineTo(-25,-58);x.moveTo(-10,-45);x.lineTo(12,-60);x.moveTo(0,-25);x.lineTo(0,0);x.lineTo(-12,15);x.moveTo(0,0);x.lineTo(15,15);x.stroke();eye(0,-36,5);x.restore()}function boss(a,b){x.save();x.translate(a,b);x.fillStyle='#493d2d';x.strokeStyle='#0a1c20';x.lineWidth=12;x.beginPath();x.moveTo(-60,0);x.lineTo(-50,-55);x.lineTo(-18,-38);x.lineTo(0,-78);x.lineTo(22,-35);x.lineTo(58,-58);x.lineTo(68,0);x.closePath();x.fill();x.stroke();x.strokeStyle='#8c3b2a';x.lineWidth=14;x.beginPath();x.moveTo(-35,-8);x.lineTo(-60,-90);x.moveTo(35,-8);x.lineTo(65,-88);x.moveTo(0,-40);x.lineTo(0,-120);x.stroke();x.fillStyle=bossPhase==='弱點'?'#d9a441':'#3f7f6b';x.beginPath();x.arc(0,-42,13,0,7);x.fill();x.restore()}function loop(now){if(!started||paused||finished)return;last=now;elapsed=(now-t0)/1000;let ni=0;for(let i=0;i<times.length;i++){if(elapsed>=times[i])ni=i;else break}if(ni!==idx)setM(ni);if(targets.length&&beat<4&&elapsed>times[idx]+.42+beat*60/M[idx].bpm+.25){miss++;combo=0;beat++;msg('MISS · 節拍已過','#e28a72')}if(M[idx].sec==='Boss'&&(M[idx].n-36)%3===1&&elapsed>times[idx]+1.5)flag=Math.max(0,flag-.18);if(flag<=0){finished=true;$('overlay').style.display='flex';$('panel').innerHTML='<h1>旗手倒下</h1><h2>出征失敗</h2><p>青銅大立人倒下了。重新整隊，再次挑戰枯樹之下。</p><button class="primary" id="again">重新出征</button>';$('again').onclick=()=>location.reload();return}if(elapsed>=times[75]){finished=true;let score=perfect*100+good*60-miss*25;$('overlay').style.display='flex';$('panel').innerHTML=`<h1>第一章完成</h1><h2>枯樹之下</h2><p>Perfect：${perfect}　Good：${good}<br>Miss：${miss}<br>青銅：12　玉料：5<br>试玩分數：${score}</p><button class="primary" id="again">再玩一次</button>`;$('again').onclick=()=>location.reload();return}let bts=document.querySelectorAll('.beat');bts.forEach((e,i)=>e.classList.toggle('active',i===beat));$('time').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('combo').textContent='連擊 '+combo;draw();requestAnimationFrame(loop)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!paused){paused=true;$('pause').textContent='繼續';msg('切換頁面，遊戲已暫停')}})})();
</script></body></html>
